name: Test Canonical Voulage COSMIC Model

on:
  push:
    paths:
      - "stage/unstable/ubuntu/resolute/package-model.json"
      - "tests/model-integrity.sh"
      - "tests/canonical-regolith-cosmic-model.sh"
      - ".github/workflows/test-canonical-voulage-model.yml"
  pull_request:
    paths:
      - "stage/unstable/ubuntu/resolute/package-model.json"
      - "tests/model-integrity.sh"
      - "tests/canonical-regolith-cosmic-model.sh"
      - ".github/workflows/test-canonical-voulage-model.yml"
  workflow_dispatch:

jobs:
  canonical-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate canonical Resolute model
        env:
          VERIFY_REMOTE_REFS: "1"
        run: |
          bash -n tests/model-integrity.sh
          bash -n tests/canonical-regolith-cosmic-model.sh
          jq -e . stage/unstable/ubuntu/resolute/package-model.json >/dev/null
          ./tests/model-integrity.sh stage/unstable/ubuntu/resolute/package-model.json
          ./tests/canonical-regolith-cosmic-model.sh
